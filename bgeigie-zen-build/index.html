<!DOCTYPE html>
<html>
<head>
  <title data-i18n="ui.pageTitle"></title>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" data-i18n-content="ui.description" />
  <link rel="icon" href="favicon.svg" media="(prefers-color-scheme: light)" />
  <link rel="icon" href="favicon.svg" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="cover-open">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="icon-iron" viewBox="0 0 24 24"><path d="M3 21l6-6M9 15l2.5 2.5L20 9l-2.5-2.5zM14 4l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-pliers" viewBox="0 0 24 24"><path d="M4 4l6 7M9 4l2 6M11 10l3 3 6 7M11 10l-1 4-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-cutters" viewBox="0 0 24 24"><path d="M5 3l5 8M11 3l-1 8M10 11l-3 10M10 11l4 10M4 3h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-tape" viewBox="0 0 24 24"><circle cx="10" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="11" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 18h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-stripper" viewBox="0 0 24 24"><path d="M3 12h7M14 12h7M10 9v6M14 9v6M10 12h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="icon-screwdriver" viewBox="0 0 24 24"><path d="M4 20l5-5M9 15l-1-3 8-8 4 4-8 8zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <header class="topbar">
    <a class="back" href="./" data-i18n="ui.back"></a>
    <span class="product" data-i18n="ui.product"></span>
    <div id="language" class="segmented lang-toggle" role="group" data-i18n-aria="ui.language"></div>
  </header>

  <main class="sheet">
    <aside class="panel" aria-live="polite">
      <div class="panel-head">
        <span id="chapter" class="chapter"></span>
        <span id="stepCount" class="step-count"></span>
      </div>
      <div class="step-number" id="stepNumber"></div>
      <h1 id="stepTitle"></h1>
      <p id="stepText" class="step-text"></p>
      <section id="partsBox" class="parts-box" hidden>
        <h2 data-i18n="ui.partsHeading"></h2>
        <ul id="partsList"></ul>
      </section>
      <div id="tools" class="tools" hidden></div>
      <ul id="checks" class="checks" hidden></ul>
      <ul id="notes" class="notes"></ul>
      <div class="evidence-row"><span class="evidence-label" data-i18n="ui.source"></span><span id="evidence"></span></div>
    </aside>

    <section class="stage">
      <canvas id="scene" data-i18n-aria="ui.canvasLabel"></canvas>
      <svg id="arrows" class="overlay"></svg>
      <div id="labels" class="overlay labels"></div>
      <div class="view-tools">
        <div class="segmented" role="group" data-i18n-aria="ui.styleGroup">
          <button id="styleColour" aria-pressed="true" data-i18n="ui.styleColour"></button>
          <button id="styleLine" aria-pressed="false" data-i18n="ui.styleLine"></button>
        </div>
        <button id="flip" data-i18n="ui.flip" data-i18n-title="ui.flipTitle"></button>
        <button id="fit" data-i18n="ui.fit" data-i18n-title="ui.fitTitle"></button>
      </div>
      <div id="loader" class="loader" data-i18n="ui.loading"></div>

      <div id="cover" class="cover">
        <div class="cover-card">
          <div class="cover-kicker" data-i18n="ui.coverKicker"></div>
          <div class="cover-title" data-i18n="ui.coverTitle"></div>
          <div class="cover-sub" data-i18n="ui.coverSub"></div>
          <ul class="cover-facts">
            <li><b id="coverSteps"></b> <span data-i18n="ui.coverSteps"></span></li>
            <li><b id="coverChapters"></b> <span data-i18n="ui.coverChapters"></span></li>
            <li><b id="coverTools"></b> <span data-i18n="ui.coverTools"></span></li>
          </ul>
          <button id="start" class="start" data-i18n="ui.start"></button>
          <p class="cover-hint" data-i18n="ui.coverHint"></p>
          <p class="cover-credit">
            <span id="creditText"></span>
            <span class="credit-links">
              <a href="https://github.com/Safecast/bGeigieZen" target="_blank" rel="noopener" data-i18n="ui.creditGithub"></a>
              <a href="https://discord.gg/XDXkhQd8bC" target="_blank" rel="noopener" data-i18n="ui.creditDiscord"></a>
            </span>
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer class="timeline">
    <div class="transport">
      <button id="prev" data-i18n-aria="ui.prev">‹</button>
      <button id="play" data-i18n-aria="ui.play"><span class="play-icon"></span></button>
      <button id="next" data-i18n-aria="ui.next">›</button>
      <button id="replay" data-i18n-aria="ui.replay" data-i18n-title="ui.replay">↺</button>
    </div>
    <div class="track">
      <div id="chapters" class="chapters"></div>
      <input id="scrub" type="range" min="0" max="22" step="0.001" value="0" data-i18n-aria="ui.timeline" />
      <div id="ticks" class="ticks"></div>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
